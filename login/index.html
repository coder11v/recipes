<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Divya's Recipes</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms@0.5.0"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="bg-gradient-to-br from-slate-50 to-stone-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div id="auth-view" class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full">
        <h2 class="text-3xl font-bold text-gray-900 mb-6 text-center" id="auth-page-title">Sign In</h2>
        <div class="space-y-4">
            <button onclick="handleGoogleLogin()"
                class="w-full flex items-center justify-center space-x-3 px-4 py-3 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5" alt="Google">
                <span class="font-semibold text-gray-700">Continue with Google</span>
            </button>

            <div class="relative py-4">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-300"></div></div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-white text-gray-500 font-medium uppercase tracking-wider">or email</span>
                </div>
            </div>

            <form id="auth-page-form" onsubmit="handleEmailAuth(event)" class="space-y-4">
                <input type="email" id="auth-page-email" required placeholder="Email Address"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500">
                <input type="password" id="auth-page-password" required placeholder="Password"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500">
                <button type="submit" id="auth-page-submit-btn"
                    class="w-full bg-teal-600 text-white font-bold py-3 rounded-lg hover:bg-teal-700 transition">
                    Sign In
                </button>
            </form>

            <p id="auth-page-toggle-text" class="text-center text-sm text-gray-600">
                Don't have an account? <button onclick="toggleAuthMode()" class="text-teal-600 font-bold hover:underline">Sign Up</button>
            </p>
        </div>
    </div>

    <script>
        const WORKER_URL = 'https://recipeapi.veerbajaj11.workers.dev';
        let authMode = 'login';

        async function initAuth() {
            try {
                const response = await fetch(`${WORKER_URL}/auth/config`);
                const config = await response.json();

                const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js");
                const { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js");

                const app = initializeApp(config);
                const authInstance = getAuth(app);

                window.auth = {
                    instance: authInstance,
                    signInWithPopup: (provider) => signInWithPopup(authInstance, provider),
                    onAuthStateChanged: (cb) => onAuthStateChanged(authInstance, cb),
                    googleProvider: new GoogleAuthProvider()
                };

                // Watch for changes (e.g. Google Login result)
                auth.onAuthStateChanged(user => {
                    if (user) {
                        saveAndRedirect(user);
                    }
                });
            } catch (err) {
                console.error('Failed to initialize Auth:', err);
            }
        }

        function saveAndRedirect(user) {
            const userData = {
                uid: user.uid,
                email: user.email,
                displayName: user.displayName || user.email.split('@')[0],
                photoURL: user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName || user.email)}&background=0d9488&color=fff`
            };
            localStorage.setItem('recipe_user', JSON.stringify(userData));
            window.location.href = '../index.html';
        }

        function toggleAuthMode() {
            authMode = authMode === 'login' ? 'signup' : 'login';
            document.getElementById('auth-page-title').textContent = authMode === 'login' ? 'Sign In' : 'Create Account';
            document.getElementById('auth-page-submit-btn').textContent = authMode === 'login' ? 'Sign In' : 'Sign Up';
            document.getElementById('auth-page-toggle-text').innerHTML = authMode === 'login' 
                ? `Don't have an account? <button onclick="toggleAuthMode()" class="text-teal-600 font-bold hover:underline">Sign Up</button>`
                : `Already have an account? <button onclick="toggleAuthMode()" class="text-teal-600 font-bold hover:underline">Sign In</button>`;
        }

        async function handleGoogleLogin() {
            try {
                await auth.signInWithPopup(auth.googleProvider);
            } catch (err) {
                console.error('Google login error:', err);
                alert('Login failed: ' + err.message);
            }
        }

        async function handleEmailAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-page-email').value;
            const password = document.getElementById('auth-page-password').value;
            const submitBtn = document.getElementById('auth-page-submit-btn');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';

            try {
                const endpoint = authMode === 'login' ? '/auth/login' : '/auth/signup';
                const response = await fetch(`${WORKER_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error?.message || 'Authentication failed');

                // Proxy Success! Manual object for localStorage
                const user = {
                    uid: data.localId,
                    email: data.email,
                    displayName: data.displayName || data.email.split('@')[0],
                };
                saveAndRedirect(user);
            } catch (err) {
                console.error('Auth error:', err);
                alert(err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = authMode === 'login' ? 'Sign In' : 'Sign Up';
            }
        }

        document.addEventListener('DOMContentLoaded', initAuth);
    </script>
</body>
</html>
